<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium blue gradient: bright to deep blue -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="40%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#1E40AF" />
    </linearGradient>
    
    <!-- Gold accent gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
    
    <!-- Premium glow effect -->
    <filter id="premiumGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Shadow effect -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" floodOpacity="0.25" />
    </filter>
  </defs>
  
  <!-- Main background square with rounded corners -->
  <rect x="32" y="32" width="192" height="192" rx="32" fill="url(#mainGradient)" filter="url(#premiumGlow)" />
  
  <!-- Subtle inner shadow for depth -->
  <rect x="32" y="32" width="192" height="192" rx="32" fill="none" stroke="rgba(0,0,0,0.1)" strokeWidth="2" />
  
  <!-- Top-left highlight for dimension -->
  <rect x="32" y="32" width="96" height="96" rx="32" fill="white" opacity="0.2" />
  
  <!-- Gold accent stripe on the right -->
  <rect x="200" y="80" width="12" height="128" rx="6" fill="url(#goldAccent)" opacity="0.9" />
  
  <!-- Premium text: BW -->
  <text x="128" y="148" textAnchor="middle" fontSize="96" fontWeight="900" fontFamily="'Poppins', 'Arial', sans-serif" fill="white" letterSpacing="-4">
    BW
  </text>
  
  <!-- Decorative line below -->
  <line x1="80" y1="172" x2="176" y2="172" stroke="white" strokeWidth="2" opacity="0.4" strokeLinecap="round" />
</svg>
